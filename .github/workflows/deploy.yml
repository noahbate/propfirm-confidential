name: Deploy to Vercel (prop-firm-app)

on:
  push:
    branches: [main]
    paths:
      - 'prop-firm-app/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prop-firm-app/package-lock.json

      - name: Install dependencies
        working-directory: prop-firm-app
        run: npm ci

      # Deploy from inside the app dir; project rootDirectory is unset so the CLI
      # deploys exactly this directory.
      - name: Deploy to Vercel (production)
        working-directory: prop-firm-app
        run: npx vercel@latest --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
